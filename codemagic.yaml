workflows:
  ios-workflow:
    name: NEXTO iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Create iOS folder
        script: |
          flutter create --platforms=ios . --org com.nexto.app
          flutter packages pub get
      - name: Build IPA without signing
        script: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          mkdir Payload
          cd Payload
          ln -s ../Runner.app
          cd ..
          zip -r -y -q NEXTO.ipa Payload
    artifacts:
      - build/ios/iphoneos/NEXTO.ipa
